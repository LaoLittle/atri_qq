syntax = "proto3";

package signature;

message DeviceProperty {
  uint32 id = 1;
  bytes value = 2;
}

message TokenReport {
  repeated DeviceProperty properties = 1;
  bytes previous_token = 2;
}

message IssuedTokenReply {
  bytes token = 1;
  uint64 expires_at = 2;
}

message Extra {
  bytes channel_uuid = 1;
  bytes qua = 2;
  bytes reserved = 3;
}
