[package]
name = "atri_qq_protocol"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
serde_json = "1"
ciborium = "0.2"
thiserror = "2"
prost = "0.14"
prost-reflect = "0.16.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "multipart", "query"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
rand = "0.10"
hostname = "0.4"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
md4 = "0.11"
sha3 = "0.12"
crc32fast = "1"
aes-gcm = "0.11"
openssl = { version = "0.10", features = ["vendored"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }
hex = "0.4"
itoa = "1"
base64 = "0.23"
uuid = { version = "1", features = ["serde"] }
quick-xml = "0.42"
tracing = "0.1"
signing = { package = "atri_qq_signing", path = "../signing" }
atri_qq_silk = { path = "../silk" }
mp4 = "0.14"
jce = { path = "../crates/jce" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rand_chacha = "0.10"
