syntax = "proto2";
package atri.qq.sso;
message SecureInfo {
  optional bytes sign = 1;
  optional bytes token = 2;
  optional bytes extra = 3;
}
message Reserved {
  optional bytes client_ip_cookie = 8;
  optional uint32 flag = 9;
  optional uint32 environment_id = 10;
  optional uint32 locale_id = 11;
  optional bytes qimei = 12;
  optional string environment = 13;
  optional uint32 new_connection_flag = 14;
  optional string trace_parent = 15;
  optional string uid = 16;
  optional uint32 imsi = 18;
  optional uint32 network_type = 19;
  optional uint32 ip_stack_type = 20;
  optional uint32 message_type = 21;
  optional TrpcResponse trpc_response = 22;
  repeated TransInfo trans_info = 23;
  optional SecureInfo secure_info = 24;
  optional uint32 secure_signature_flag = 25;
  optional uint32 nt_core_version = 26;
  optional uint32 rtt_correction_ms = 27;
  optional uint32 ip_origin = 28;
  optional bytes pressure_token = 30;
  optional uint64 response_timestamp_ms = 31;
  optional uint32 application_state = 34;
}
message TrpcResponse {
  optional int32 code = 1;
  optional int32 function_code = 2;
  optional bytes error_message = 3;
}
message TransInfo {
  optional string key = 1;
  optional bytes value = 2;
}
