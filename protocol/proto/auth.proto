syntax = "proto2";
package atri.qq.auth;
import "guild_sync.proto";

message KeyExchangeSecret { optional string uin = 1; optional bytes guid = 2; }
message KeyExchangeRequest {
  optional bytes public_key = 1;
  optional uint32 type = 2;
  optional bytes encrypted_secret = 3;
  optional uint64 timestamp = 4;
  optional bytes encrypted_hash = 5;
}
message KeyExchangeResponse { optional bytes encrypted_secret = 1; optional bytes signature = 2; optional bytes public_key = 3; }
message KeyExchangeSession { optional bytes key = 1; optional bytes ticket = 2; optional int64 expire_seconds = 3; }
message NtForward { optional bytes ticket = 1; optional bytes encrypted = 3; optional uint32 type = 4; }
message NtAccountRequest { optional string uin = 1; }
message NtClient { optional string os = 1; optional string device_name = 2; optional uint32 platform = 3; optional bytes guid = 4; }
message NtApp { optional string kernel = 1; optional uint32 app_id = 2; optional string package_name = 3; optional string qua = 5; }
message NtCookie { optional bytes cookie = 1; }
message NtError { optional uint64 code = 1; optional string title = 2; optional string message = 3; optional string jump_word = 4; optional string jump_url = 5; }
message NtSecurity { optional uint32 mode = 1; }
message NtRequestHead { optional NtAccountRequest account = 1; optional NtClient client = 2; optional NtApp app = 3; optional NtCookie cookie = 5; optional NtSecurity security = 7; optional NtCookie long_cookie = 8; }
message NtRequest { optional NtRequestHead head = 1; optional bytes body = 2; }
message NtLoginBody { optional bytes a1 = 1; optional NtCaptcha captcha = 2; }
message NtRefreshTicketBody { optional bytes a1 = 1; }
message NtUnusualLoginBody { optional bytes a1 = 1; optional bytes one_click_succeed_sig = 2; }
message NtCaptcha { optional string ticket = 1; optional string random = 2; optional string sid = 3; }
message NtNewDeviceBody { optional string success_token = 1; }
// The common envelope carries an RPC-specific body.
message NtResponse { optional NtResponseHead head = 1; optional bytes body = 2; }
message NtResponseHead { optional NtError error = 4; optional NtCookie cookie = 5; optional NtCookie long_cookie = 8; }
message NtEasyLoginResponseBody { optional NtTickets tickets = 1; optional NtUnusualDevice protection = 3; }
message NtPasswordResponseBody { optional NtTickets tickets = 1; optional NtCaptchaChallenge captcha = 2; optional NtUnusualDevice protection = 3; optional NtAccount account = 4; }
message NtNewDeviceResponseBody { optional NtTickets tickets = 1; optional NtAccount account = 3; }
message NtPasswordVerificationResponseBody { optional NtTickets tickets = 1; optional NtAccount account = 2; }
message NtRefreshTicketResponseBody { optional NtTickets tickets = 1; optional NtAccount account = 2; }
message NtCaptchaChallenge { optional string url = 3; }
message NtUnusualDevice { optional bytes signature = 2; }
message NtAccount { optional uint64 uin = 1; optional string uid = 2; optional NtNickname profile = 3; }
message NtNickname { optional string nickname = 1; }
message NtTickets {
  optional bytes a1 = 3;
  optional bytes a2 = 4;
  optional bytes d2 = 5;
  optional bytes d2_key = 6;
  optional NtTgt tgt = 8;
  optional NtServiceTicket service_ticket = 9;
  optional NtHttpTicket http_ticket = 11;
  optional NtTicketTimeValues raw_time_field12 = 12;
  optional bytes no_pic_sig = 13;
  optional bytes a1_key = 14;
  optional NtTicketTimeValues raw_time_field16 = 16;
  optional bytes a2_key = 17;
}
message NtTicketTimeValues { optional uint64 raw_field1 = 1; optional uint64 raw_field2 = 2; }
message NtTgt { optional bytes a2_key = 2; optional NtUserProfile profile = 11; optional bytes session_ticket = 12; optional bytes session_ticket_key = 13; }
message NtUserProfile { optional uint32 face_id = 1; optional string nickname = 2; optional uint32 gender = 3; optional uint32 age = 5; }
message NtServiceTicket { optional bytes ticket = 1; optional bytes key = 2; }
message NtHttpTicket { optional bytes ticket = 2; }
message QrDevice { optional string os = 1; optional string name = 2; }
message QrCapabilities { optional uint32 nt_login = 6; }
message QrRequestExtension { optional QrDevice device = 1; optional QrCapabilities capabilities = 4; }
message QrResponseExtension { optional string url = 2; }
message WtUidTicket { optional WtUidLayer layer = 9; }
message WtUidLayer { optional WtUid identity = 11; }
message WtUid { optional string uid = 1; }

message Kick {
 optional uint64 account = 1;
 optional uint32 same_device = 2;
 optional string message = 3;
 optional string title = 4;
 optional uint32 app_id = 5;
 optional uint32 instance_id = 6;
 optional uint32 kicked_type = 7;
 optional uint32 security_kicked_type = 8;
}
message StatusDevice { optional bytes name = 1; optional bytes kernel = 2; optional bytes vendor = 3; optional bytes model = 4; optional bytes os = 5; }
message UnregisterRequest { optional uint32 type = 1; optional StatusDevice device = 2; optional uint32 reason = 3; }
message StatusResponse { optional string message = 2; }
message HeartbeatState { optional uint32 silence_status = 1; optional uint32 silent_version = 2; }
message HeartbeatRequest { optional uint32 type = 1; optional HeartbeatState state = 2; optional uint32 battery_status = 3; optional uint64 trigger_time = 4; }
message HeartbeatResponse { optional uint32 interval_seconds = 3; }
message InfoSyncRequest {
  optional uint32 sync_flag = 1;
  optional uint32 request_random = 2;
  optional uint32 current_active_status = 4;
  optional uint64 group_last_message_time = 5;
  optional SyncState sync = 6;
  optional uint64 group_code = 7;
  optional bytes platform_extension = 8;
  optional RegisterInfo register = 9;
  optional atri.qq.guild.GuildSyncRequest guild_sync = 10;
  optional AppState app = 11;
  optional AiSyncRequest ai_sync = 13;
}
message AiSyncRequest { repeated AiSyncCursor businesses = 2; }
message AiSyncCursor {
  optional uint32 business_id = 1;
  optional uint64 latest_message_time = 2;
  optional uint64 latest_change_time = 3;
  optional bool change_sync_enabled = 4;
}
message SyncState { optional bytes current_cookie = 1; optional uint64 last_message_time = 2; optional bytes previous_cookie = 3; }
message RegisterDevice { optional string name = 1; optional string kernel = 2; optional string os_version = 3; optional string brand = 4; optional string os = 5; }
message RegisterBusiness { optional uint32 notify_switch = 1; optional uint32 bound_uin_notify_switch = 2; }
message RegisterInfo {
  optional string guid = 1;
  optional uint32 kick_pc = 2;
  optional string version = 3;
  optional uint32 first_register = 4;
  optional uint32 locale = 5;
  optional RegisterDevice device = 6;
  optional uint32 mute = 7;
  optional uint32 vendor_type = 8;
  optional uint32 user_trigger = 9;
  optional RegisterBusiness business = 10;
  optional uint32 battery_status = 11;
  optional uint32 set_status = 12;
  optional RegisterFlags flags = 14;
  optional uint32 scene = 16;
  optional uint32 background_time = 17;
  optional bool is_chat_on_focus = 18;
}
message RegisterFlags { optional uint32 silence_status = 1; optional uint32 silent_version = 2; }
message AppState { optional uint32 is_delay_req = 1; optional uint32 app_status = 2; optional uint32 silence_status = 3; }
message InfoSyncRegisterResponse {
  optional string message = 2;
  optional uint64 server_time = 3;
  optional uint32 heartbeat_interval_seconds = 4;
  optional uint32 field5 = 5;
}
message InfoSyncDelay { optional uint32 field_1 = 1; optional uint32 field_2 = 2; }
message InfoSyncResponse {
  optional uint32 result = 1;
  optional bytes error = 2;
  optional uint32 request_random = 3;
  optional uint32 group_count = 4;
  optional uint32 sync_interval = 5;
  optional uint32 field_6 = 6;
  optional InfoSyncRegisterResponse register = 7;
  optional uint32 group_replenishment = 8;
  optional uint32 field_9 = 9;
  optional InfoSyncDelay delay = 10;
}

// MsgPush field 4 is an opaque server-provided acknowledgment descriptor.
// Preserve it verbatim, including unknown fields; it is not an SSO sequence.
message PushAckSource { optional uint32 required = 3; repeated bytes descriptors = 4; }
message PushAckRequest { repeated bytes descriptors = 1; }
