syntax = "proto2";
package atri.qq.personal_events;

message PersonalEventsRequest {
  optional bytes cursor = 1;
}
message PersonalEventsResponse {
  optional uint64 result = 1;
  optional bytes error_message = 2;
  repeated bytes groups = 3;
  optional bytes cursor = 4;
}
message PersonalEventGroup {
  optional uint64 group_uin = 1;
  repeated bytes events = 2;
}
message PersonalEventRecord {
  optional uint64 event_type = 1;
  optional uint64 message_seq = 2;
  optional uint64 field_3 = 3;
  optional uint64 field_4 = 4;
  optional uint64 field_5 = 5;
}
