syntax = "proto2";
package atri.qq.media;

message LegacyVideoPlayRequest {
  optional uint32 command = 1;
  optional uint32 sequence = 2;
  optional LegacyVideoDownloadRequest download = 4;
  repeated LegacyVideoExtension extension = 100;
}
message LegacyVideoExtension {
  optional uint32 sub_business_type = 1;
}
message LegacyVideoDownloadRequest {
  optional uint64 from_uin = 1;
  optional uint64 to_uin = 2;
  optional uint32 chat_type = 3;
  optional uint32 client_type = 4;
  optional bytes file_id = 5;
  optional uint64 group_uin = 6;
  optional uint32 agent_type = 7;
  optional bytes file_md5 = 8;
  optional uint32 business_type = 9;
  optional uint32 file_type = 10;
  optional uint32 down_type = 11;
  optional uint32 scene_type = 12;
  optional uint32 need_inner_address = 13;
  optional uint32 request_transfer_type = 14;
  optional uint32 request_host_type = 15;
  optional uint32 supports_large_size = 20;
  optional uint32 client_quic_enabled = 30;
  optional uint32 target_codec_format = 31;
  optional LegacyVideoDeviceCodecInfo device_codec_info = 32;
  optional uint32 source_format = 33;
}

message LegacyVideoDeviceCodecInfo {
  optional string platform_chip_info = 1;
  optional string os_version = 2;
  optional string device_name = 3;
}
message LegacyVideoPlayResponse {
  optional uint32 command = 1;
  optional uint32 sequence = 2;
  optional LegacyVideoDownloadResponse download = 4;
}
message LegacyVideoDownloadResponse {
  optional int32 code = 1;
  optional bytes message = 2;
  optional bytes file_md5 = 6;
  optional LegacyVideoDownloadAddress address = 9;
  optional bytes encrypt_key = 10;
  optional uint32 video_codec_format = 32;
}
message LegacyVideoDownloadAddress {
  repeated string ipv4_hosts = 10;
  optional string url_args = 11;
  repeated string ipv6_hosts = 21;
  repeated string domain_hosts = 22;
}
